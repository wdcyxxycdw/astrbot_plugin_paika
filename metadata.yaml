name: paika
display_name: 排卡组队
short_desc: QQ 群聊组队，多房间排队、表情上车、满员发车与超时结束。
desc: >-
  面向 OneBot v11 / NapCat 的 QQ 群聊排卡插件。支持自定义房间标题、
  多房间并行、同群一人一房、斜杠指令、回复消息上下车和 LLM 工具。
  支持 NapCat 表情回应上下车、满员自动发车、发车后成员锁定、
  房主结束房间、定时提醒和超时结束，状态通知使用 At 列出成员。
version: 0.1.1
author: paika
repo: "https://github.com/wdcyxxycdw/astrbot_plugin_paika"
astrbot_version: ">=4.25.0,<5"
support_platforms:
  - aiocqhttp
tags:
  - QQ
  - 群聊
  - 组队
  - NapCat
